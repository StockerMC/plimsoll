# Rendered by scripts/savings.sh: NAME, MIB, REQUEST, RECOMMENDER.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app: NAME
  template:
    metadata:
      labels:
        app: NAME
    spec:
      # hold.py ignores SIGTERM; a short grace period keeps resize restarts from idling 30 s.
      terminationGracePeriodSeconds: 2
      containers:
        - name: memload
          image: python:3.13-alpine
          command: ["python3", "-u", "/memload/hold.py", "MIB"]
          volumeMounts:
            - name: memload
              mountPath: /memload
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              cpu: 100m
              memory: REQUEST
            limits:
              cpu: 100m
              memory: REQUEST
      volumes:
        - name: memload
          configMap:
            name: memload
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: NAME
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: NAME
  recommenders:
    - name: RECOMMENDER
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["memory"]
        controlledValues: RequestsAndLimits
