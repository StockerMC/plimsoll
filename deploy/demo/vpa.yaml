apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo
  recommenders:
    - name: plimsoll
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["memory"]
---
# Same target with no recommender named, so upstream's recommender handles it and ours ignores it.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: demo-default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["memory"]
